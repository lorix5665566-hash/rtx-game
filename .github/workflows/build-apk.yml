name: Build Vanguard RTX APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
              echo "Restored project debug.keystore from debug.keystore.base64"
            else
              echo "::warning::debug.keystore.base64 not found! Generating temporary keystore (SHA-1 will NOT match Firebase Google Sign-In)."
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1|SHA256" || true

      - name: Prepare Google Services config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              trimmed="$(printf '%s' "$GOOGLE_SERVICES_JSON" | sed 's/^[[:space:]]*//')"
              if printf '%s' "$trimmed" | grep -q '^{'; then
                printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
              else
                printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '\n\r ' | base64 -d > app/google-services.json
              fi
              echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret."
            else
              echo "::warning::app/google-services.json is missing and secret GOOGLE_SERVICES_JSON is not set. Add GOOGLE_SERVICES_JSON in GitHub Actions secrets for Firebase & Google Sign-In."
              mkdir -p app/src/debug/res/values
              printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="default_web_client_id" translatable="false"></string>\n</resources>\n' > app/src/debug/res/values/ci_google_services_fallback.xml
            fi
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Copy APK to friendly filename
        run: cp app/build/outputs/apk/debug/app-debug.apk Vanguard-RTX.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vanguard-RTX-APK
          path: Vanguard-RTX.apk
          if-no-files-found: error

      - name: Publish direct APK to GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest Vanguard-RTX.apk --clobber
          else
            gh release create latest Vanguard-RTX.apk \
              --title "Vanguard RTX (APK)" \
              --notes "Автоматическая сборка Vanguard RTX. Нажмите на файл Vanguard-RTX.apk ниже, чтобы скачать и установить на Android."
          fi
