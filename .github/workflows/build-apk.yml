name: Build Vanguard RTX APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
              echo "Restored project debug.keystore from debug.keystore.base64"
            else
              echo "::warning::debug.keystore.base64 not found! Generating temporary keystore (SHA-1 will NOT match Firebase Google Sign-In)."
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1|SHA256" || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Supabase .env config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          CLEAN_URL=$(printf '%s' "$SUPABASE_URL" | tr -d '\r\n"' | xargs)
          CLEAN_KEY=$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '\r\n"' | xargs)
          if [ -n "$CLEAN_URL" ] && [ -n "$CLEAN_KEY" ]; then
            printf "SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n" "$CLEAN_URL" "$CLEAN_KEY" > .env
            echo "Configured .env from GitHub Actions Secrets."
          else
            echo "::warning::SUPABASE_URL or SUPABASE_ANON_KEY not set in GitHub Secrets; APK will build with placeholder values."
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Copy APK to friendly filename
        run: cp app/build/outputs/apk/debug/app-debug.apk Vanguard-RTX.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vanguard-RTX-APK
          path: Vanguard-RTX.apk
          if-no-files-found: error

      - name: Publish direct APK to GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest Vanguard-RTX.apk --clobber
          else
            gh release create latest Vanguard-RTX.apk \
              --title "Vanguard RTX (APK)" \
              --notes "Автоматическая сборка Vanguard RTX. Нажмите на файл Vanguard-RTX.apk ниже, чтобы скачать и установить на Android."
          fi
